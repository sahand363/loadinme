<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoadInMe — Log in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-wrap">
  <h1>⬆ LoadInMe</h1>
  <p>Log in to see your files and clips.</p>
  <form method="post" action="/login">
    <label>Username</label>
    <input name="username" autocomplete="username" autofocus required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Log in</button>
  </form>
  <div class="error" id="err"></div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search), e = q.get('error'), msg = '';
    if (e === 'locked') {
      var m = Math.max(1, Math.ceil((parseInt(q.get('wait'), 10) || 60) / 60));
      msg = 'Too many wrong tries. Wait ' + m + ' minute' + (m === 1 ? '' : 's') + ' and try again.';
    } else if (e) {
      msg = 'Wrong username or password. Try again.';
    }
    document.getElementById('err').textContent = msg;
  })();
</script>
</body>
</html>
